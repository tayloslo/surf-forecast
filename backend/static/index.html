<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surf Forecast Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌊 Surf Forecast</h1>
    <p class="tagline">Click a dot for live conditions and a 7-day forecast.</p>
  </header>

  <main>
    <div id="map"></div>

    <aside id="detail-panel" class="hidden">
      <button id="close-panel-btn" class="link-btn">&times; Close</button>
      <div id="detail-content">Loading...</div>
    </aside>
  </main>

  <footer>
    <p>Data: NOAA NDBC buoys (live observations) &middot; Open-Meteo Marine/Weather (NOAA/ECMWF wave &amp; wind models) &middot; Spots: OpenStreetMap contributors + curated CA breaks</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
